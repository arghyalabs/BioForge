[workspace]
members = [
    "crates/bioforge_diagnostics",
    "crates/bioforge_types",
    "crates/bioforge_ast",
    "crates/bioforge_lexer",
    "crates/bioforge_parser",
    "crates/bioforge_hir",
    "crates/bioforge_biology",
    "crates/bioforge_state",
    "crates/bioforge_physics",
    "crates/bioforge_measurement",
    "crates/bioforge_render",
    "crates/bioforge_reaction",
    "crates/bioforge_electrophysiology",
    "crates/bioforge_cell",
    "crates/bioforge_tissue",
    "crates/bioforge_multiscale",
    "crates/bioforge_cli",
]
default-members = ["crates/bioforge_cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arghyalabs/BioForge"
rust-version = "1.75.0"
description = "A biology-native programming language and multiscale biological simulation platform"

[workspace.dependencies]
# Internal crates
bioforge_diagnostics = { path = "crates/bioforge_diagnostics" }
bioforge_types = { path = "crates/bioforge_types" }
bioforge_ast = { path = "crates/bioforge_ast" }
bioforge_lexer = { path = "crates/bioforge_lexer" }
bioforge_parser = { path = "crates/bioforge_parser" }
bioforge_hir = { path = "crates/bioforge_hir" }
bioforge_biology = { path = "crates/bioforge_biology" }
bioforge_state = { path = "crates/bioforge_state" }
bioforge_physics = { path = "crates/bioforge_physics" }
bioforge_measurement = { path = "crates/bioforge_measurement" }
bioforge_render = { path = "crates/bioforge_render" }
bioforge_reaction = { path = "crates/bioforge_reaction" }
bioforge_electrophysiology = { path = "crates/bioforge_electrophysiology" }
bioforge_cell = { path = "crates/bioforge_cell" }
bioforge_tissue = { path = "crates/bioforge_tissue" }
bioforge_multiscale = { path = "crates/bioforge_multiscale" }

# Lexing
logos = "0.14"

# Error reporting
ariadne = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Testing
insta = { version = "1.39", features = ["yaml"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
